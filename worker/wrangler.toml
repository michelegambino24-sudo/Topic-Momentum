name = "topic-momentum-meter"
main = "worker.js"
compatibility_date = "2026-10-30"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://michelegambino24-sudo.github.io"
NEW_TOPICS_PER_DAY = "30"
AI_SEARCHES_PER_DAY = "50"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_JUDGE_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
# 70B planning; Qwen judging uses verified no-thinking JSON.
# Daily usage is settled to measured neurons, never a fixed estimate per attempt.
# 9000 neurons/day; 600 initially reserved, grown before calls up to 2400/search.
# Unused reservations are refunded. At most 50 admitted attempts/day.
AI_TIMEOUT_MS = "12000"
AI_PREPARATION_MS = "90000"

[[kv_namespaces]]
binding = "TMM"
# Local-only placeholder. Replace with the real namespace ID in step 6.
id = "276a9e65cd504d1092c476a7e5eabc9a"

# Development-only bindings are passed with: npx wrangler dev --var ENVIRONMENT:dev
[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1
