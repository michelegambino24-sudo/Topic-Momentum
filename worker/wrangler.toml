name = "topic-momentum-meter"
main = "worker.js"
compatibility_date = "2026-10-30"
workers_dev = false

[vars]
ALLOWED_ORIGIN = ""
NEW_TOPICS_PER_DAY = "90"

[[kv_namespaces]]
binding = "TMM"
# Local-only placeholder. Replace with the real namespace ID in step 6.
id = "00000000000000000000000000000000"

# Development-only bindings are passed with: npx wrangler dev --var ENVIRONMENT:dev
[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"
